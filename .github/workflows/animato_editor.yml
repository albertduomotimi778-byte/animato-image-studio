# Animato — AI Auto Video Editor.
#
# Installed and kept up to date automatically by the Animato app.
# One run edits ONE upload: transcribe the voice, cut fillers / retakes /
# dead air, match the video to what is said and compile the final MP4 with
# the captions drawn onto the picture. A screen recording with NO voice is
# watched by the AI, trimmed, narrated with a neural voice and subtitled.

name: Animato AI Video Editor

run-name: "Animato editor · ${{ github.event.client_payload.job.title || (github.event_name == 'workflow_dispatch' && 'warm-up') || 'video' }} [${{ github.event.client_payload.job_id || 'manual' }}]"

on:
  repository_dispatch:
    types: [edit_video]
  # The app runs this once when the account is prepared, so the AI model and speech-to-text are
  # downloaded and cached before the first real edit.
  workflow_dispatch:
    inputs:
      warmup:
        description: 'Only download and cache the tools'
        required: false
        default: 'true'

permissions:
  contents: read

concurrency:
  group: animato-editor-${{ github.event.client_payload.job_id || github.run_id }}
  cancel-in-progress: false

jobs:
  edit:
    name: Edit video
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout (the editor only)
        uses: actions/checkout@v4
        with:
          sparse-checkout: animato-cloud

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Python (speech-to-text)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install the voice engine (narrates silent screen recordings)
        continue-on-error: true
        run: python -m pip install --quiet --disable-pip-version-check edge-tts

      - name: Install FFmpeg
        run: |
          # Skip the slow package-list refresh when the runner's lists are fresh enough.
          if ! command -v ffmpeg > /dev/null; then
            sudo apt-get install -y -qq --no-install-recommends ffmpeg > /dev/null 2>&1 \
              || { sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg > /dev/null; }
          fi
          ffmpeg -hide_banner -version | head -n 1
          nproc

      # AI (Gemini first for editing, Groq/OpenRouter fallbacks) and speech-to-text (Groq Whisper) are hosted:
      # the runner asks the app server, which holds and rotates the keys. Nothing is installed or run on this CPU.

      - name: Edit the video
        if: github.event_name == 'repository_dispatch'
        run: node --experimental-strip-types animato-cloud/editor.mts

      - name: Keep the edited video as a run artifact
        if: always() && github.event_name == 'repository_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: animato-edit-${{ github.run_id }}
          path: |
            output/editor/edited.mp4
            output/editor/captions.ass
          retention-days: 7
          if-no-files-found: ignore
